<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend API Tester</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 { color: #333; }
        .test-section {
            background: #f5f5f5;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #45a049; }
        .result {
            background: white;
            padding: 15px;
            margin-top: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            white-space: pre-wrap;
            font-family: monospace;
            max-height: 400px;
            overflow: auto;
        }
        .success { border-left: 4px solid #4CAF50; }
        .error { border-left: 4px solid #f44336; }
        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status.online { background: #4CAF50; color: white; }
        .status.offline { background: #f44336; color: white; }
        input, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
        }
    </style>
</head>
<body>
    <h1>🧪 Lakehouse Explorer - API Tester</h1>
    <p>Test backend API connectivity without the frontend framework.</p>

    <div class="test-section">
        <h2>Backend Status</h2>
        <div id="status">Checking...</div>
        <button onclick="testHealth()">Check Health</button>
        <div id="health-result" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>1. Generate Metadata</h2>
        <div>
            <label>Storage Type:</label>
            <select id="gen-storage">
                <option value="aws">AWS S3</option>
                <option value="minio">MinIO</option>
            </select>
        </div>
        <div>
            <label>Bucket:</label>
            <input id="gen-bucket" value="metadataproject" />
        </div>
        <div>
            <label>CSV Path:</label>
            <input id="gen-path" value="test-data/customer_data/customer_data.csv" style="width: 500px;" />
        </div>
        <button onclick="testGenerateMetadata()">Generate Metadata</button>
        <div id="gen-result" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>2. Get Schema</h2>
        <div>
            <label>Storage Type:</label>
            <select id="schema-storage">
                <option value="aws">AWS S3</option>
                <option value="minio">MinIO</option>
            </select>
        </div>
        <div>
            <label>Bucket:</label>
            <input id="schema-bucket" value="metadataproject" />
        </div>
        <div>
            <label>Table Path:</label>
            <input id="schema-path" value="test-data/customer_data/customer_data_delta" style="width: 500px;" />
        </div>
        <div>
            <label>Format:</label>
            <select id="schema-format">
                <option value="">Auto-detect</option>
                <option value="delta">Delta</option>
                <option value="iceberg">Iceberg</option>
                <option value="hudi">Hudi</option>
                <option value="parquet">Parquet</option>
            </select>
        </div>
        <button onclick="testGetSchema()">Get Schema</button>
        <div id="schema-result" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>3. Get Partitions</h2>
        <button onclick="testGetPartitions()">Get Partitions (using schema values)</button>
        <div id="partitions-result" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>4. Get Snapshots</h2>
        <button onclick="testGetSnapshots()">Get Snapshots (using schema values)</button>
        <div id="snapshots-result" class="result" style="display:none;"></div>
    </div>

    <div class="test-section">
        <h2>5. Get Files</h2>
        <button onclick="testGetFiles()">Get Files (using schema values)</button>
        <div id="files-result" class="result" style="display:none;"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';

        async function testHealth() {
            const resultDiv = document.getElementById('health-result');
            const statusDiv = document.getElementById('status');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Testing...';
            resultDiv.className = 'result';

            try {
                const response = await fetch(`${API_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                    statusDiv.innerHTML = '<span class="status online">✓ ONLINE</span> Backend is running on port 8000';
                } else {
                    throw new Error(`HTTP ${response.status}`);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
                statusDiv.innerHTML = '<span class="status offline">✗ OFFLINE</span> Backend is not running. Start it with: .\\start_backend.ps1';
            }
        }

        async function testGenerateMetadata() {
            const resultDiv = document.getElementById('gen-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Generating metadata... (this may take 1-2 minutes)';
            resultDiv.className = 'result';

            try {
                const body = {
                    storage_type: document.getElementById('gen-storage').value,
                    bucket: document.getElementById('gen-bucket').value,
                    path: document.getElementById('gen-path').value,
                    table_format: 'delta',
                    force_refresh: false
                };

                console.log('Request:', body);

                const response = await fetch(`${API_URL}/metadata/generate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    throw new Error(JSON.stringify(data, null, 2));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testGetSchema() {
            const resultDiv = document.getElementById('schema-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Getting schema...';
            resultDiv.className = 'result';

            try {
                const body = {
                    storage_type: document.getElementById('schema-storage').value,
                    bucket: document.getElementById('schema-bucket').value,
                    path: document.getElementById('schema-path').value,
                    format: document.getElementById('schema-format').value || undefined
                };

                console.log('Request:', body);

                const response = await fetch(`${API_URL}/metadata/schema`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    throw new Error(JSON.stringify(data, null, 2));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testGetPartitions() {
            const resultDiv = document.getElementById('partitions-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Getting partitions...';
            resultDiv.className = 'result';

            try {
                const body = {
                    storage_type: document.getElementById('schema-storage').value,
                    bucket: document.getElementById('schema-bucket').value,
                    path: document.getElementById('schema-path').value,
                    format: document.getElementById('schema-format').value || undefined
                };

                const response = await fetch(`${API_URL}/metadata/partitions`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    throw new Error(JSON.stringify(data, null, 2));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testGetSnapshots() {
            const resultDiv = document.getElementById('snapshots-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Getting snapshots...';
            resultDiv.className = 'result';

            try {
                const body = {
                    storage_type: document.getElementById('schema-storage').value,
                    bucket: document.getElementById('schema-bucket').value,
                    path: document.getElementById('schema-path').value,
                    format: document.getElementById('schema-format').value || undefined
                };

                const response = await fetch(`${API_URL}/metadata/snapshots`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    throw new Error(JSON.stringify(data, null, 2));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        async function testGetFiles() {
            const resultDiv = document.getElementById('files-result');
            resultDiv.style.display = 'block';
            resultDiv.textContent = 'Getting files...';
            resultDiv.className = 'result';

            try {
                const body = {
                    storage_type: document.getElementById('schema-storage').value,
                    bucket: document.getElementById('schema-bucket').value,
                    path: document.getElementById('schema-path').value,
                    format: document.getElementById('schema-format').value || undefined
                };

                const response = await fetch(`${API_URL}/metadata/files`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.className = 'result success';
                    resultDiv.textContent = JSON.stringify(data, null, 2);
                } else {
                    throw new Error(JSON.stringify(data, null, 2));
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.textContent = `Error: ${error.message}`;
            }
        }

        //Auto-check health on page load
        window.onload = () => {
            testHealth();
        };
    </script>
</body>
</html>
