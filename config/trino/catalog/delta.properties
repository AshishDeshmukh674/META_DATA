# Trino Delta Lake Connector Configuration
# 
# This catalog allows Trino to query Delta Lake tables stored in S3
# 
# Documentation: https://trino.io/docs/current/connector/delta-lake.html

connector.name=delta_lake
hive.metastore=file
hive.metastore.catalog.dir=s3://metadataproject/

# S3 Configuration
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.endpoint=s3.${ENV:AWS_REGION}.amazonaws.com
hive.s3.region=${ENV:AWS_REGION}

# Delta Lake specific settings
delta.enable-non-concurrent-writes=true
delta.register-table-procedure.enabled=true

# Performance tuning
hive.s3.max-connections=500
hive.s3.streaming.part-size=32MB
