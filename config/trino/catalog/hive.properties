# Trino Hive Connector Configuration
# 
# This catalog allows Trino to query Parquet, Iceberg, and Hudi tables from S3
# 
# Documentation: https://trino.io/docs/current/connector/hive.html

connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://metadataproject/

# S3 Configuration
hive.s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
hive.s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}
hive.s3.endpoint=s3.${ENV:AWS_REGION}.amazonaws.com
hive.s3.region=${ENV:AWS_REGION}

# Allow schema-on-read for direct S3 paths
hive.non-managed-table-writes-enabled=true
hive.allow-drop-table=true
hive.allow-rename-table=true

# Performance tuning
hive.s3.max-connections=500
hive.s3.streaming.part-size=32MB
hive.max-partitions-per-scan=100000

# Enable ORC and Parquet optimizations
hive.orc.use-column-names=true
hive.parquet.use-column-names=true
